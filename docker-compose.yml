name: teamforge
services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: teamforge
      POSTGRES_PASSWORD: teamforge_local
      POSTGRES_DB: teamforge
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamforge -d teamforge"]
      interval: 5s
      timeout: 3s
      retries: 10
  db-test:
    image: postgres:16.15-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: teamforge
      POSTGRES_PASSWORD: teamforge_test
      POSTGRES_DB: teamforge_test
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamforge -d teamforge_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
