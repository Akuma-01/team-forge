name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: teamforge
          POSTGRES_PASSWORD: ci-only-local
          POSTGRES_DB: teamforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamforge -d teamforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://teamforge:ci-only-local@127.0.0.1:5432/teamforge_test
      DATABASE_URL_DIRECT: postgres://teamforge:ci-only-local@127.0.0.1:5432/teamforge_test
      TEST_DATABASE_URL: postgres://teamforge:ci-only-local@127.0.0.1:5432/teamforge_test
      APP_ORIGIN: http://localhost
      PG_POOL_MAX: "20"
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm run migrate
      - run: npm test
      - run: npm run test:race
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrency-evidence
          path: .cache/phase4/*.json
          if-no-files-found: ignore
      - run: npm run invariants
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:auth
      - run: npm run smoke:teams
      - run: npm run smoke:live
      - run: npm run smoke:workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-workspace-evidence
          path: .cache/phase7/
          if-no-files-found: ignore
