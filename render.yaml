# Prepared for Phase 8. No hosted service has been created.
services:
  - type: web
    name: teamforge
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PG_POOL_MAX
        value: "20"
      - key: INVITE_TTL_HOURS
        value: "48"
